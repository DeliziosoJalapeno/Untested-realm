sonar.projectKey=sorcery-simulator
sonar.projectName=Sorcery Simulator
sonar.projectVersion=0.5.0

# Source roots (production code) kept separate from test roots
sonar.sources=packages/shared/src,packages/client/src,packages/server/src
sonar.tests=packages/shared/test,packages/client/test

sonar.sourceEncoding=UTF-8

# Let the analyzer resolve types across the monorepo
sonar.typescript.tsconfigPaths=packages/shared/tsconfig.json,packages/client/tsconfig.json,packages/server/tsconfig.json

# Exclude build output, deps, and bulk data/generated assets (not hand-written logic)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.tsbuildinfo,**/*.json,**/public/**,**/*.md
